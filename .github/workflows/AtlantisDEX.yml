name: GUI CI in Docker

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci -t atlantisdex/ci-chrome-138:latest .

      - name: Run tests in Docker
        env:
          SEED: ${{ secrets.SEED_PHRASE }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PIN: ${{ secrets.PIN }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            -e SEED \
            -e PASSWORD \
            -e PIN \
            atlantisdex/ci-chrome-138:latest

      - name: Upload screen recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-recording
          path: target/allure-results/screen_recording.mp4

      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: gh-pages/allure-history

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v2
        with:
          publish_dir: gh-pages/allure-history
          publish_branch: gh-pages
          personal_token: ${{ secrets.GITHUB_TOKEN }}
